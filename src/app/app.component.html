<div class="container">
  <h1>Travel Itinerary Visualizer</h1>

  <form [formGroup]="tripForm" (ngSubmit)="addTrip()">
    <div class="form-group">
      <label for="startPoint">Start Point:</label>
      <input
        type="text"
        id="startPoint"
        formControlName="startPoint"
        placeholder="Enter start location (min 3 characters)"
      />
      <div
        class="error"
        *ngIf="
          tripForm.get('startPoint')?.invalid &&
          tripForm.get('startPoint')?.touched
        "
      >
        Start point is required (minimum 3 characters)
      </div>
    </div>

    <div class="form-group">
      <label for="endPoint">End Point:</label>
      <input
        type="text"
        id="endPoint"
        formControlName="endPoint"
        placeholder="Enter end location (min 3 characters)"
      />
      <div
        class="error"
        *ngIf="
          tripForm.get('endPoint')?.invalid && tripForm.get('endPoint')?.touched
        "
      >
        End point is required (minimum 3 characters)
      </div>
    </div>

    <button type="submit" [disabled]="tripForm.invalid">Add Trip</button>
  </form>

  <div class="itinerary-container" *ngIf="trips.length > 0">
    <h2>Your Itinerary</h2>

    <div class="trip-visualization">
      <div class="trip-levels">
        <div class="level level-1">Level 1</div>
        <div class="level level-2">Level 2</div>
      </div>

      <div class="trips-container">
        <div
          *ngFor="let trip of trips; let i = index"
          class="trip"
          [class.level-2]="trip.level === 2"
          [class.level-1]="trip.level === 1"
        >
          <div class="point start">
            <div class="point-marker"></div>
            <div class="point-code">{{ getStartPointCode(trip) }}</div>
          </div>

          <div class="connection" [class.continued]="trip.isContinued">
            <div class="line" [class.with-arrow]="!trip.isContinued"></div>
          </div>

          <div class="point end">
            <div class="point-marker"></div>
            <div class="point-code">{{ getEndPointCode(trip) }}</div>
          </div>

          <button class="delete-btn" (click)="deleteTrip(trip.id)">X</button>
        </div>
      </div>
    </div>

    <div class="trip-list">
      <h3>Trip Details</h3>
      <ul>
        <li *ngFor="let trip of trips">
          {{ trip.startPoint }} to {{ trip.endPoint }}
          <span *ngIf="trip.isContinued">(Continued)</span>
          <span *ngIf="trip.level === 2">(Level 2)</span>
        </li>
      </ul>
    </div>
  </div>
</div>
